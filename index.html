<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #7c3aed 0%, #db2777 50%, #f97316 100%);
      color: #1e293b;
    }
    .card {
      width: min(100%, 460px);
      padding: 42px 30px;
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(124, 58, 237, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .tag {
      display: inline-block;
      margin-bottom: 18px;
      padding: 7px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, #fdf2f8, #fff7ed);
      color: #db2777;
      border: 1px solid #fbcfe8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .05em;
    }
    h1 {
      margin-bottom: 12px;
      background: linear-gradient(135deg, #7c3aed, #ec4899, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 32px;
      font-weight: 800;
    }
    p { margin-bottom: 24px; color: #4b5563; line-height: 1.6; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 26px;
      background: linear-gradient(135deg, #db2777, #f97316);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(219, 39, 119, 0.35);
      transition: all 0.2s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(249, 115, 22, 0.45);
      background: linear-gradient(135deg, #c026d3, #ea580c);
    }
    button:focus-visible { outline: 3px solid #f472b6; outline-offset: 3px; }
    #clock { margin-top: 24px; color: #475569; font-size: 14px; font-weight: 500; }
    footer { margin-top: 28px; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">MY FIRST WEBSITE</span>
    <h1>Welcome!</h1>
    <p>This is a simple sample website built with HTML, CSS, and JavaScript.</p>
    <button type="button" id="messageButton">Click Me</button>
    <div id="clock" aria-live="polite"></div>
    <footer>Made with HTML, CSS &amp; JavaScript</footer>
  </main>

  <script>
    document.getElementById("messageButton").addEventListener("click", function () {
      alert("Congratulations! Your website is working!");
    });

    function updateClock() {
      document.getElementById("clock").textContent =
        "Date & Time: " + new Date().toLocaleString();
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
