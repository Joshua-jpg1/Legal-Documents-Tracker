databases:
  - name: legal-docs-db
    databaseName: legal_docs
    user: legal_user
    plan: free

services:
  - type: web
    name: legal-documents-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: legal-docs-db
          property: connectionString
